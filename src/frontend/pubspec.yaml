name: typeoke_frontend
description: Typeoke web frontend (typing game on top of the official YouTube player).
publish_to: none
version: 0.1.0+1

environment:
  sdk: 3.13.4
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
