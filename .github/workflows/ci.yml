name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Sync the locked environment
        run: uv --directory src/backend sync --locked
      - name: Ruff lint
        run: uv --directory src/backend run ruff check . ../../scripts
      - name: Ruff format
        run: uv --directory src/backend run ruff format --check . ../../scripts
      - name: Mypy
        run: uv --directory src/backend run mypy --strict
      - name: Tests and overall coverage
        run: uv --directory src/backend run pytest --cov --cov-fail-under=85
      # The 100 % coverage gate of scoring.py and timeline.py (see README, Python)
      # is added by task 3.4, when those files exist.
      - name: Text files and content
        run: python3 scripts/check_text_files.py

  flutter:
    name: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Tests with coverage
        run: flutter test --coverage
      # --require-files is added in milestone 4, once lib/scoring or lib/game exist.
      - name: Dart coverage limits
        working-directory: .
        run: python3 scripts/check_dart_coverage.py src/frontend/coverage/lcov.info
      - name: Build web release
        run: flutter build web --release --csp --no-web-resources-cdn

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      OSV_SCANNER_VERSION: "2.7.0"
      OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      # Full history: gitleaks scans every commit, not only the tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      # The release binaries are used instead of the vendor actions: the gitleaks
      # action needs a license key for organization repositories and the osv-scanner
      # action is a reusable workflow that needs extra permissions. The expected
      # SHA-256 values above come from the checksum files of each release.
      - name: Install gitleaks and osv-scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          curl --fail --silent --show-error --location --retry 3 --output bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  bin/osv-scanner" | sha256sum --check --strict
          chmod +x bin/gitleaks bin/osv-scanner
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secrets in the full history (gitleaks)
        run: gitleaks git --redact --no-banner --exit-code 1 .
      - name: Python dependencies (pip-audit)
        run: |
          uv --directory src/backend export --frozen --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx "pip-audit==${PIP_AUDIT_VERSION}" --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
      - name: Python and Dart lockfiles (osv-scanner)
        run: osv-scanner scan source -L src/backend/uv.lock -L src/frontend/pubspec.lock
